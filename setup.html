document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 align-items:center; gap:20px; flex-wrap:wrap; font-size:14.5px; color:#93A2AD\">\n      <a href=\"index.html#faces\" style=\"color:#93A2AD\">The five faces<\u002Fa>\n      <a href=\"shortcuts.html\" style=\"color:#93A2AD\">Shortcuts<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section id=\"setup\" style=\"padding:clamp(36px,6vw,72px) 0 0\">\n    <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.16em; text-transform:uppercase; color:#68D5C0; margin:0 0 18px\">Setup guide · all five faces<\u002Fp>\n    <h1 style=\"font-family:'Barlow Semi Condensed',sans-serif; font-weight:600; font-size:clamp(32px,7vw,56px); line-height:1.06; margin:0 0 14px; letter-spacing:-0.01em; text-wrap:balance\">Setting up a face<\u002Fh1>\n    <p style=\"font-size:17.5px; color:#93A2AD; margin:0 0 40px; max-width:62ch; line-height:1.6\">Everything is configured on the watch itself. There is no phone app to install and nothing to sign into. In short: install from Google Play, make it your face, then hold the face to customise. The long version is below, written for someone who has never opened the watch's editor.<\u002Fp>\n      <div style=\"display:grid; gap:14px; max-width:320px; margin:0 0 44px\">\n        <img src=\"4e03ad2a-8897-4503-beb5-cba975883843\" alt=\"The Customize editor on Home and Away's Away zone setting: setting names across the top, preview in the middle, a curved row of dots down the right edge\" style=\"width:100%; aspect-ratio:1; display:block; border-radius:14px; background:#000\">\n        <p style=\"font-size:13.5px; line-height:1.55; color:#7E8D97; margin:0\">The editor: setting name at the top, preview in the middle, nameless dots down the right. Home &amp; Away, Away zone tab.<\u002Fp>\n      <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:16px; margin:0 0 56px\">\n      <div style=\"background:#0E1720; border:1px solid #21313C; border-radius:12px; padding:22px 24px\">\n        <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; color:#7E8D97; margin:0 0 8px\">BEFORE YOU START<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:#A9B7BF; margin:0\">The face must be the one you see when you raise your wrist. If not, pick it in the Galaxy Wearable app on the phone (Watch faces tab), or use Step 1 below to bring it to the middle of the row and tap it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#0E1720; border:1px solid #21313C; border-radius:12px; padding:22px 24px\">\n        <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; color:#7E8D97; margin:0 0 8px\">THE TWO BUTTONS<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:#A9B7BF; margin:0\">On the right side of the watch: the upper one is Home, the lower one is Back. <strong style=\"color:#EAF2F5; font-weight:600\">Back is the one that saves.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#0E1720; border:1px solid #21313C; border-radius:12px; padding:22px 24px\">\n        <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; color:#7E8D97; margin:0 0 8px\">THE SCREEN<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:#A9B7BF; margin:0\">It must be awake. Raise your wrist, or press the upper button once.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border-bottom:1px solid #21313C\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px 28px; align-items:start; padding:26px 0; border-top:1px solid #21313C\">\n        <div>\n          <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.14em; color:#68D5C0; margin:0 0 8px\">STEP 01<\u002Fp>\n          <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:22px; font-weight:600; margin:0; line-height:1.2\">Open the editor<\u002Fh3>\n        <\u002Fdiv>\n        <ul style=\"margin:0; padding:0; list-style:none; display:grid; gap:10px; font-size:15.5px; line-height:1.65; color:#A9B7BF\">\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Put one fingertip on the middle of the face and keep it there, without moving, for about one second. The face shrinks and the word <strong style=\"color:#EAF2F5; font-weight:600\">Customize<\u002Fstrong> appears below it. Lift your finger.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>If the screen scrolled or an app opened instead, the finger moved. Try again and hold still.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>If you see a row of faces, the one in the middle is the one you are about to edit. Swipe sideways to bring yours to the middle.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Tap Customize. The editor opens on the first setting.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px 28px; align-items:start; padding:26px 0; border-top:1px solid #21313C\">\n        <div>\n          <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.14em; color:#68D5C0; margin:0 0 8px\">STEP 02<\u002Fp>\n          <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:22px; font-weight:600; margin:0; line-height:1.2\">Read the screen<\u002Fh3>\n        <\u002Fdiv>\n        <ul style=\"margin:0; padding:0; list-style:none; display:grid; gap:10px; font-size:15.5px; line-height:1.65; color:#A9B7BF\">\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Across the top is the name of the setting you are on — “Zone 1”, say — with the next setting greyed out to its right.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>In the middle is a small preview of the face. Every change shows there at once. <strong style=\"color:#EAF2F5; font-weight:600\">The preview is the only place that tells you what you have chosen.<\u002Fstrong><\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Down the right edge is a curved row of grey dots, one per choice, with a white dot on the current one. The dots have no names.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>There is no Save and no Cancel. Whatever the preview shows when you leave is what the face becomes. Change a mistake back before you leave.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px 28px; align-items:start; padding:26px 0; border-top:1px solid #21313C\">\n        <div>\n          <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.14em; color:#68D5C0; margin:0 0 8px\">STEP 03<\u002Fp>\n          <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:22px; font-weight:600; margin:0; line-height:1.2\">Move between settings<\u002Fh3>\n        <\u002Fdiv>\n        <ul style=\"margin:0; padding:0; list-style:none; display:grid; gap:10px; font-size:15.5px; line-height:1.65; color:#A9B7BF\">\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Swipe left across the middle of the screen to go to the next setting; swipe right to go back. The name at the top changes to confirm it.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Do not swipe on the dots at the right edge — that changes the choice, not the setting.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px 28px; align-items:start; padding:26px 0; border-top:1px solid #21313C\">\n        <div>\n          <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.14em; color:#68D5C0; margin:0 0 8px\">STEP 04<\u002Fp>\n          <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:22px; font-weight:600; margin:0; line-height:1.2\">Change a choice<\u002Fh3>\n        <\u002Fdiv>\n        <ul style=\"margin:0; padding:0; list-style:none; display:grid; gap:10px; font-size:15.5px; line-height:1.65; color:#A9B7BF\">\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>On a Galaxy Watch 7 and other models without a ring, slide a fingertip slowly around the outer rim of the screen, as if tracing the edge of a coin. Clockwise moves forward, counter-clockwise back. On a Classic model, turn the ring.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Tapping the dots also works, but only moves forward one step per tap, so use the rim to go back.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Watch the preview, not the dots. For a zone, it shows the abbreviation and the current time there. The list runs west to east: Honolulu and the Americas, then Europe and Africa, then Asia, then Australia and New Zealand. <strong style=\"color:#EAF2F5; font-weight:600\">Off<\u002Fstrong> is the first entry wherever a zone can be switched off.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>For Colors the whole preview repaints in the new theme. There are eight.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>For Complication (the chips on Trio, Home &amp; Away and Family): tap the chip you want on the preview, pick from the list of apps and cards that opens, then press the lower button once to return. Repeat for the other chips. <a href=\"shortcuts.html\">What can go in a chip.<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px 28px; align-items:start; padding:26px 0; border-top:1px solid #21313C\">\n        <div>\n          <p style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.14em; color:#68D5C0; margin:0 0 8px\">STEP 05<\u002Fp>\n          <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:22px; font-weight:600; margin:0; line-height:1.2\">Save and leave<\u002Fh3>\n        <\u002Fdiv>\n        <ul style=\"margin:0; padding:0; list-style:none; display:grid; gap:10px; font-size:15.5px; line-height:1.65; color:#A9B7BF\">\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Press the lower button on the right side of the watch once. The editor closes and the face appears with your choices. That is the whole save; there is nothing to confirm.<\u002Fli>\n          <li style=\"padding:0 0 0 18px; position:relative\"><span style=\"position:absolute; left:0; top:0; color:#68D5C0\">–<\u002Fspan>Pressing it once more by accident only returns you to the face. Nothing is lost.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:24px; font-weight:600; margin:64px 0 18px\">What is in each face's editor<\u002Fh3>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:16px\">\n      <a href=\"moonrise.html#settings\" style=\"display:block; background:#0E1720; border:1px solid #21313C; border-radius:12px; padding:20px 22px; color:#EAF2F5\" style-hover=\"border-color:#68D5C0; text-decoration:none\">\n        <p style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:18px; font-weight:600; margin:0 0 6px\">Moonrise<\u002Fp>\n        <p style=\"font-size:14.5px; line-height:1.55; color:#93A2AD; margin:0\">Zone 1 · Zone 2 · Zone 3 (Off or a zone) · Colors<\u002Fp>\n      <\u002Fa>\n      <a href=\"trio.html#settings\" style=\"display:block; background:#0E1720; border:1px solid #21313C; border-radius:12px; padding:20px 22px; color:#EAF2F5\" style-hover=\"border-color:#68D5C0; text-decoration:none\">\n        <p style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:18px; font-weight:600; margin:0 0 6px\">Trio<\u002Fp>\n        <p style=\"font-size:14.5px; line-height:1.55; color:#93A2AD; margin:0\">Zone 1 · Zone 2 · Zone 3 · Colors · Complication (three chips)<\u002Fp>\n      <\u002Fa>\n      <a href=\"home-and-away.html#settings\" style=\"display:block; background:#0E1720; border:1px solid #21313C; border-radius:12px; padding:20px 22px; color:#EAF2F5\" style-hover=\"border-color:#68D5C0; text-decoration:none\">\n        <p style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:18px; font-weight:600; margin:0 0 6px\">Home &amp; Away<\u002Fp>\n        <p style=\"font-size:14.5px; line-height:1.55; color:#93A2AD; margin:0\">Away zone · Away detail · Colors · Weather · Complication (one chip)<\u002Fp>\n      <\u002Fa>\n      <a href=\"family.html#settings\" style=\"display:block; background:#0E1720; border:1px solid #21313C; border-radius:12px; padding:20px 22px; color:#EAF2F5\" style-hover=\"border-color:#68D5C0; text-decoration:none\">\n        <p style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:18px; font-weight:600; margin:0 0 6px\">Family<\u002Fp>\n        <p style=\"font-size:14.5px; line-height:1.55; color:#93A2AD; margin:0\">Person 1 zone, label, color · Person 2 zone, label, color · Detail line · Colors · Complication (two call chips)<\u002Fp>\n      <\u002Fa>\n      <a href=\"ring.html#settings\" style=\"display:block; background:#0E1720; border:1px solid #21313C; border-radius:12px; padding:20px 22px; color:#EAF2F5\" style-hover=\"border-color:#68D5C0; text-decoration:none\">\n        <p style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:18px; font-weight:600; margin:0 0 6px\">24-Hour Ring<\u002Fp>\n        <p style=\"font-size:14.5px; line-height:1.55; color:#93A2AD; margin:0\">Zone 1 · Zone 2 (Off or a zone) · Zone labels · Colors<\u002Fp>\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif; font-size:24px; font-weight:600; margin:64px 0 18px\">If something goes wrong<\u002Fh3>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:28px 48px\">\n      <div>\n        <p style=\"font-size:16px; font-weight:600; color:#EAF2F5; margin:0 0 6px\">Holding the face does nothing<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:#A9B7BF; margin:0\">The screen was asleep. Tap it once to wake it, then hold.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:16px; font-weight:600; color:#EAF2F5; margin:0 0 6px\">A different face appeared when you finished<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:#A9B7BF; margin:0\">The face row in Step 1 was left with another face in the middle. Hold the face again, swipe to yours, tap it.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:16px; font-weight:600; color:#EAF2F5; margin:0 0 6px\">It says CST when you expected CDT<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:#A9B7BF; margin:0\">It is not wrong, it is the time of year. Each zone switches between standard and daylight time by itself on the right dates. Never change a zone for the season.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:16px; font-weight:600; color:#EAF2F5; margin:0 0 6px\">The weather shows 0° just after installing<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:#A9B7BF; margin:0\">Switch to any other face and back once. The watch starts sending weather to the face after that.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:16px; font-weight:600; color:#EAF2F5; margin:0 0 6px\">The face says “Hold face to set up”<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:#A9B7BF; margin:0\">That is the hint for Step 1. It disappears after your first change and never comes back.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"display:grid; gap:14px; padding:44px 0 0; margin:56px 0 0; border-top:1px solid #21313C; font-size:14px; color:#7E8D97\">\n    <div style=\"display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap\">\n      <a href=\"index.html\" style=\"color:#7E8D97\">← All five faces<\u002Fa>\n      <span style=\"font-family:'IBM Plex Mono',monospace\">Screenshots: Galaxy Watch 7<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap\">\n      <span style=\"display:flex; gap:18px; flex-wrap:wrap\"><a href=\"mailto:worldclockwatch@gmail.com\" style=\"color:#7E8D97\">Support: worldclockwatch@gmail.com<\u002Fa><a href=\"privacy.html\" style=\"color:#7E8D97\">Privacy<\u002Fa><\u002Fspan>\n      <span>Built by Burr Swisher.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
